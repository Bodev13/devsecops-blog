name: Deploy to GitHub Pages

on:
    workflow_call:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev_branch

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        name: Build Docusaurus
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: Install dependencies
              run: npm install --frozen-lockfile

            - name: Create .env config file
              run: cp example.env .env || true

            - name: Build website
              run: npm run build

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: build

    deploy:
        name: Deploy to GitHub Pages
        needs: build

        if: github.ref_name == 'main' || github.ref_name == 'dev_branch'

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
